name: cookie-job
on:
  workflow_dispatch:
    inputs:
      task:
        description: job json
        required: true
concurrency:
  group: cookie
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
      - name: deps
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq aria2 p7zip-full unrar-free || true) && (sudo apt-get install -y -qq 7zip unar || true)
      - name: job
        env:
          TASK: ${{ inputs.task }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 worker.py
