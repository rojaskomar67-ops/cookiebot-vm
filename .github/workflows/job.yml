name: cookie-job
on:
  workflow_dispatch:
    inputs:
      task:
        description: job json
        required: true
concurrency:
  group: cookie-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get install -y --no-install-recommends aria2 p7zip-full unrar-free 7zip unar || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends aria2 p7zip-full unrar-free 7zip unar)
      - name: job
        env:
          TASK: ${{ inputs.task }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u worker.py
