name: verify-secret
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | python3 -c "
import sys, json
d = json.load(sys.stdin)
r = d.get('result') or {}
print('RESULT_OK' if d.get('ok') else 'RESULT_FAIL')
print('bot_id=', r.get('id'), 'username=', r.get('username'))
"
