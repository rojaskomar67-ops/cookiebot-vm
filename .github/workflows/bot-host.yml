name: Bot host
# Runs the Sukuna Telegram bot on a GitHub hosted runner: the runner has full
# egress to the Telegram DCs (the relay is what serves the /dl links) and the
# bot starts its own cloudflared quick tunnel for the public stream URL.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
concurrency:
  group: bot-host
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install cloudflared
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: fetch and decrypt the runtime payload
        env:
          PAYLOAD_KEY: ${{ secrets.KG_PAYLOAD_KEY }}
        run: |
          set -euo pipefail
          curl -sSL -o payload.xenc \
            "https://raw.githubusercontent.com/rojaskomar67-ops/cookiebot-vm/kaggle-vm/sukuna-kaggle.xenc"
          python3 - <<'PY'
          import hashlib, os, pathlib
          key = os.environ["PAYLOAD_KEY"].encode()
          data = pathlib.Path("payload.xenc").read_bytes()
          ks = bytearray()
          ctr = 0
          while len(ks) < len(data):
              ks += hashlib.sha256(key + ctr.to_bytes(8, "big")).digest()
              ctr += 1
          plain = bytes(a ^ b for a, b in zip(data, bytes(ks[:len(data)])))
          pathlib.Path("payload.tgz").write_bytes(plain)
          PY
          tar xzf payload.tgz
          chmod +x filetolink-go
          echo "payload ready"

      - name: start the bot
        run: |
          set -euo pipefail
          cd bot
          nohup bash -c 'while true; do ../filetolink-go >> ../bot.log 2>&1; sleep 5; done' \
            > /dev/null 2>&1 &
          sleep 5
          echo "bot launched"

      - name: report the status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re, time, urllib.request

          LOG = pathlib.Path("bot.log")
          ENV = pathlib.Path("bot/.env")
          REPO = "rojaskomar67-ops/cookiebot-vm"
          FILE = "kaggle-vm/bot-status.log"

          env = {}
          for line in ENV.read_text(errors="ignore").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              k, _, v = line.partition("=")
              env[k.strip()] = v.strip().strip('"').strip("'")
          pat = env.get("GITHUB_PAT_TOKEN", "")
          secret_values = [v for k, v in env.items()
                           if k in ("BOT_TOKEN", "GITHUB_PAT_TOKEN", "ENCRYPTION_KEY", "API_HASH",
                                    "BOT_SIGNING_SECRET", "URL_SHORTENER_API_KEY", "DATABASE_URL")
                           and len(v) > 7]

          def gh(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = {"Authorization": "Bearer " + pat,
                         "Accept": "application/vnd.github+json",
                         "User-Agent": "sukuna-bot-host"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request("https://api.github.com" + path, data=data,
                                           headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except Exception as e:
                  return 0, {"error": str(e)}

          def publish(text):
              body = {"message": "bot host status", "branch": "kaggle-vm",
                      "content": base64.b64encode(text.encode()[:180000]).decode()}
              code, _ = gh("PUT", "/repos/%s/contents/%s" % (REPO, FILE), body)
              if code == 422:
                  code, info = gh("GET", "/repos/%s/contents/%s" % (REPO, FILE))
                  sha = (info or {}).get("sha")
                  if sha:
                      body["sha"] = sha
                      gh("PUT", "/repos/%s/contents/%s" % (REPO, FILE), body)

          seen = 0
          tail = []
          deadline = time.time() + 5.9 * 3600
          while time.time() < deadline:
              chunk = ""
              if LOG.exists():
                  try:
                      with LOG.open("r", errors="ignore") as fh:
                          fh.seek(seen)
                          chunk = fh.read()
                          seen = fh.tell()
                  except OSError:
                      chunk = ""
              if chunk:
                  for secret in secret_values:
                      chunk = chunk.replace(secret, "***")
                  tail = (tail + chunk.splitlines())[-60:]
                  for l in tail[-25:]:
                      print(l)
                  urls = sorted(set(re.findall(r"https://[-a-z0-9]+\.trycloudflare\.com", chunk)))
                  for u in urls:
                      print("::public-stream-url::", u)
                  publish("\n".join(tail[-60:]) + ("\n" + "\n".join("stream url: " + u for u in urls) if urls else ""))
              try:
                  import urllib.request
                  with urllib.request.urlopen("http://127.0.0.1:12000/health", timeout=5) as r:
                      print("::relay-health::", r.status)
              except Exception as e:
                  print("::relay-health:: error", e)
              time.sleep(20)
          PY
